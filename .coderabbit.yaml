# CodeRabbit configuration.
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
#
# This repo uses long-lived `claude/<topic>` feature branches (see CLAUDE.md).
# Most PRs target one of those branches, not `main` — so we explicitly opt
# them into auto-review here. Without this, CodeRabbit defaults to reviewing
# only PRs that target the repository's default branch, which silently skips
# everything else we open.

language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "claude/.*"

chat:
  auto_reply: true
